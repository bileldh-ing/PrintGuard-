[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printguard-ai"
version = "0.1.0"
description = "Real-time visual quality inspection for FFF 3D printing: YOLO frame detection + temporal models + operator-approved printer pause."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bilel Dhahri" }]
requires-python = ">=3.10"
keywords = ["3d-printing", "additive-manufacturing", "computer-vision", "yolo", "quality-inspection", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pyyaml>=6",
  "requests>=2.31",
  "remotezip>=0.12",
  "onnxruntime>=1.17",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Training / evaluation / export (PyTorch). Install the CPU wheel with
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
train = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.3", "onnx>=1.15", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["printguard*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "data", "runs", "weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "N812", "N818", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N801", "RUF012"]
